[project]
name = "stocktrader"
version = "0.1.0"
description = "AI long-only US stock trader on Alpaca"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
    "tzdata",                 # time zone data for zoneinfo on Windows
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
trader = "trader.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trader"]
