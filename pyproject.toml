[project]
name = "agent-smith"
version = "0.1.0"
description = "Agentic framework solving MBPP & SWE-bench tasks (42 School project)"
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
    "mcp>=1.0,<2.0",          # Model Context Protocol SDK — pip install mcp
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

# uv uses this to turn `uv run sandbox` into an executable command
# that calls the main() function in sandbox/cli.py
[project.scripts]
sandbox = "sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "sandbox", "agent_mbpp", "agent_swebench"]